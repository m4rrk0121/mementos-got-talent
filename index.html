<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memento's Got Talent</title>
  <meta name="description" content="Sign up for Memento's Got Talent. Performers and guests — leave your name and you'll hear when it's time.">
  <meta name="theme-color" content="#120c0a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23120c0a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e4b15a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@380;520;640&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage" aria-hidden="true">
    <video id="bg-video" autoplay muted loop playsinline></video>
    <div class="stage-light"></div>
    <div class="stage-curtains"></div>
    <div class="stage-wash"></div>
  </div>

  <div class="wrap">
    <header>
      <p class="mark">Memento's Got Talent</p>
      <p class="status"><span class="dot"></span> Signups open</p>
    </header>

    <section class="hero">
      <h1>Put your<br>name down.</h1>
      <p class="lede">Performers and guests. Leave an email and you’ll hear when the night is on.</p>
      <p class="acts">Singers · Comics · Dancers · Magicians · The unexpected</p>
    </section>

    <section class="card" aria-labelledby="signup-title">
      <h2 id="signup-title">Save your spot</h2>
      <p class="card-note">Takes half a minute. We’ll only use this to reach you about the show.</p>

      <form id="signup" novalidate>
        <label class="hp" for="company">Company</label>
        <input class="hp" id="company" name="company" tabindex="-1" autocomplete="off">

        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required placeholder="Your name">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@email.com">

        <fieldset>
          <legend>I’m signing up to</legend>
          <div class="roles">
            <label><input type="radio" name="role" value="Perform" required><span>Perform</span></label>
            <label><input type="radio" name="role" value="Come along"><span>Come along</span></label>
          </div>
        </fieldset>

        <label for="note">Anything we should know <span>(optional)</span></label>
        <textarea id="note" name="note" rows="3" placeholder="Your act, your plus-one, a question…"></textarea>

        <button type="submit">Save my spot</button>
        <p id="form-message" role="status"></p>
      </form>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
